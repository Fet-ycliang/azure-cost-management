[project]
name = "azure-cost-mcp"
version = "0.1.0"
description = "Azure Cost MCP service for FinOps analysis and tagging governance"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.25.3",
    "azure-storage-blob>=12.28.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.0",
    "pydantic-settings>=2.14.0",
]

[project.scripts]
azure-cost-mcp = "azure_cost_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
