[project]
name = "azure-cost-mcp"
version = "0.1.0"
description = "Azure Cost MCP service for FinOps analysis and tagging governance"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.5",
    "azure-identity>=1.25.3",
    "azure-storage-blob>=12.28.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.0",
    "pydantic-settings>=2.14.0",
]

[project.scripts]
azure-cost-mcp = "azure_cost_mcp:main"

[dependency-groups]
test = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "sqlalchemy[asyncio]>=2.0",
    "pgvector>=0.3.6",
]
lakebase = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "databricks-sdk>=0.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=azure_cost_mcp --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
source = ["src/azure_cost_mcp"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
